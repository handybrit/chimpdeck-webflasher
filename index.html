<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChimpDeck Web Flasher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --amber: #ffb000; --amber-dim: #b97e00; --black: #000000; }
  * { box-sizing: border-box; }
  body {
    background: var(--black);
    color: var(--amber);
    font-family: "VT323", "Courier New", Courier, monospace;
    font-size: 22px;
    line-height: 1.35;
    max-width: 680px;
    margin: 0 auto;
    padding: 2em 1em 3em;
    text-align: center;
  }
  header { margin-bottom: 1em; }
  header img {
    display: block;
    width: 180px;
    height: 180px;
    margin: 0 auto 0.2em;
  }
  h1 {
    font-size: 3em;
    line-height: 1;
    margin: 0;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .version { color: var(--amber-dim); margin: 0.4em 0 0; }
  .flash-box {
    border: 1px solid var(--amber);
    background: #0a0800;
    padding: 1.2em;
    margin: 1em 0;
  }
  .flash-box p { margin: 0 0 0.8em; }
  esp-web-install-button { display: inline-block; }
  .chrome-note { color: var(--amber-dim); }
</style>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js"></script>
</head>
<body>
<header>
  <img src="./chimpdeck-logo.png" alt="ChimpDeck monkey face logo, orange on black" width="180" height="180">
  <h1>ChimpDeck</h1>
  <p class="version">Version 1.4.0, 2026-11-05</p>
  <p class="version">GT911 touch fix</p>
</header>

<div class="flash-box">
  <p><esp-web-install-button manifest="./manifest.json"></esp-web-install-button></p>
  <p class="chrome-note">Needs desktop Chrome or Edge. Web Serial does not work in Safari, Firefox, or on an iPad.</p>
</div>
</body>
</html>
