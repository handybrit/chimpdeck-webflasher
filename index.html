<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChimpDeck Web Flasher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --amber: #ffb000; --amber-dim: #b97e00; --black: #000000; }
  * { box-sizing: border-box; }
  body {
    background: var(--black);
    color: var(--amber);
    font-family: "VT323", "Courier New", Courier, monospace;
    font-size: 22px;
    line-height: 1.35;
    max-width: 680px;
    margin: 0 auto;
    padding: 2em 1em 3em;
    text-align: center;
  }
  header { margin-bottom: 1em; }
  header img {
    display: block;
    width: 180px;
    height: 180px;
    margin: 0 auto 0.2em;
  }
  h1 {
    font-size: 3em;
    line-height: 1;
    margin: 0;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .version { color: var(--amber-dim); margin: 0.4em 0 0; }
  .flash-box {
    border: 1px solid var(--amber);
    background: #0a0800;
    padding: 1.2em;
    margin: 1em 0;
  }
  .flash-box p { margin: 0 0 0.8em; }
  esp-web-install-button { display: inline-block; }
  /* ChimpDeck theme for the esp-web-tools button and install dialog.
     The dialog is a shadow-DOM component, but its colours are driven by
     Material Design CSS custom properties, which inherit through the
     shadow boundary. Verified in headless Chrome against esp-web-tools
     10.4.0: setting these on ewt-install-dialog turns the white dialog
     black with amber text. The dialog's own :host defaults are overridden
     by page rules targeting the element. The Logs console pane itself
     (ewt-console) hardcodes #1c1c1c / #ddd in its own shadow DOM and does
     not use these tokens, so it stays dark grey, not amber; changing it
     would need a forked component. */
  esp-web-install-button {
    --esp-tools-button-color: #ffb000;
    --esp-tools-button-text-color: #000000;
    --esp-tools-button-border-radius: 2px;
  }
  ewt-install-dialog {
    --md-sys-color-primary: #ffb000;
    --md-sys-color-on-primary: #000000;
    --md-sys-color-surface: #000000;
    --md-sys-color-surface-container: #000000;
    --md-sys-color-surface-container-high: #0a0800;
    --md-sys-color-surface-container-highest: #0a0800;
    --md-sys-color-secondary-container: #1a1400;
    --md-sys-color-on-surface: #ffb000;
    --md-sys-color-on-surface-variant: #ffb000;
    --md-sys-color-tertiary: #ffb000;
    --md-sys-color-tertiary-container: #1a1400;
    --md-sys-color-shadow: #000000;
    --roboto-font: "VT323", "Courier New", Courier, monospace;
    --md-ref-typeface-brand: "VT323", "Courier New", Courier, monospace;
    --md-ref-typeface-plain: "VT323", "Courier New", Courier, monospace;
    --md-sys-typescale-headline-font: "VT323", "Courier New", Courier, monospace;
    --md-sys-typescale-title-font: "VT323", "Courier New", Courier, monospace;
    --md-sys-typescale-body-large-font: "VT323", "Courier New", Courier, monospace;
    --md-sys-typescale-body-medium-font: "VT323", "Courier New", Courier, monospace;
    --md-sys-typescale-label-large-font: "VT323", "Courier New", Courier, monospace;
    --text-color: #ffb000;
  }
  .chrome-note { color: var(--amber-dim); }
</style>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js"></script>
</head>
<body>
<header>
  <img src="./chimpdeck-logo.png" alt="ChimpDeck monkey face logo, orange on black" width="180" height="180">
  <h1>ChimpDeck</h1>
  <p class="version">Version 1.6.0, 2026-11-05</p>
  <p class="version">What's changed: GT911 wake fix and stale touch flag clear, live XY in header during touch test, header now says ChimpDeck.</p>
</header>

<div class="flash-box">
  <p><esp-web-install-button manifest="./manifest.json"></esp-web-install-button></p>
  <p class="chrome-note">Needs desktop Chrome. Web Serial does not work in Safari, Firefox, or on an iPad.</p>
</div>
</body>
</html>
